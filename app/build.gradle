plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ktrsis.capas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ktrsis.capas.stencil'
        minSdk 29
        targetSdk 35
        versionCode 27
        versionName '0.27-lab'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
