name: Compilar Camara Tattoo

on:
  push:
    branches: [ camara-tattoo ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CamaraTattoo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CamaraTattoo-apk
          path: CamaraTattoo.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: camara-v1.${{ github.run_number }}
          name: Camara Tattoo v1.${{ github.run_number }}
          target_commitish: camara-tattoo
          files: CamaraTattoo.apk
